<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KR App Ranking CRM — 2026-06-29</title>
  <style>
    :root {
      --bg: #f1f5f9;
      --card: #ffffff;
      --border: #e2e8f0;
      --text: #1e293b;
      --muted: #64748b;
      --primary: #4f46e5;
      --primary-light: #eef2ff;
      --primary-dark: #4338ca;
      --success: #059669;
      --success-light: #d1fae5;
      --warning: #d97706;
      --warning-light: #fef3c7;
      --bd-row: #f0fdf4;
      --bd-hover: #dcfce7;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: var(--bg); color: var(--text); font-size: 14px; }
    
    header { background: var(--card); border-bottom: 1px solid var(--border); padding: 16px 24px; display: flex; align-items: center; justify-content: space-between; position: sticky; top: 0; z-index: 100; box-shadow: 0 1px 3px rgba(0,0,0,.06); }
    .header-left h1 { font-size: 18px; font-weight: 700; color: var(--primary); }
    .header-left span { font-size: 12px; color: var(--muted); margin-top: 2px; display: block; }
    .header-right { font-size: 12px; color: var(--muted); text-align: right; }
    
    .toolbar { background: var(--card); border-bottom: 1px solid var(--border); padding: 10px 24px; display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
    
    .seg-group { display: flex; gap: 4px; background: var(--bg); padding: 3px; border-radius: 8px; }
    .seg-btn { padding: 5px 14px; border: none; background: none; border-radius: 6px; font-size: 13px; cursor: pointer; color: var(--muted); font-weight: 500; transition: all .15s; }
    .seg-btn.active { background: var(--card); color: var(--primary); box-shadow: 0 1px 3px rgba(0,0,0,.1); }
    
    .toggle-btn { display: flex; align-items: center; gap: 6px; padding: 5px 12px; border: 1px solid var(--border); background: var(--card); border-radius: 6px; font-size: 13px; cursor: pointer; color: var(--muted); font-weight: 500; transition: all .15s; user-select: none; }
    .toggle-btn.active { background: var(--success-light); color: var(--success); border-color: var(--success); }
    .toggle-dot { width: 10px; height: 10px; border-radius: 50%; background: currentColor; opacity: .5; }
    .toggle-btn.active .toggle-dot { opacity: 1; }
    
    .search-box { flex: 1; min-width: 160px; max-width: 280px; padding: 6px 12px; border: 1px solid var(--border); border-radius: 6px; font-size: 13px; outline: none; transition: border .15s; }
    .search-box:focus { border-color: var(--primary); }
    
    .sort-select { padding: 5px 10px; border: 1px solid var(--border); border-radius: 6px; font-size: 13px; background: var(--card); cursor: pointer; outline: none; }
    
    main { max-width: 1400px; margin: 0 auto; padding: 20px 24px; }
    
    .stats-row { display: flex; gap: 12px; margin-bottom: 20px; flex-wrap: wrap; }
    .stat-card { background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 14px 18px; flex: 1; min-width: 140px; }
    .stat-label { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .5px; font-weight: 600; }
    .stat-value { font-size: 28px; font-weight: 700; color: var(--primary); margin-top: 4px; }
    .stat-sub { font-size: 11px; color: var(--muted); margin-top: 2px; }
    
    .section { margin-bottom: 28px; }
    .section-title { font-size: 15px; font-weight: 700; color: var(--text); margin-bottom: 12px; display: flex; align-items: center; gap: 8px; }
    .section-title .badge { font-size: 11px; font-weight: 600; padding: 2px 8px; border-radius: 20px; background: var(--primary-light); color: var(--primary); }
    
    .subsection { margin-bottom: 16px; }
    .subsection-title { font-size: 12px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: .5px; margin-bottom: 8px; padding: 0 2px; }
    
    .table-wrap { background: var(--card); border: 1px solid var(--border); border-radius: 10px; overflow: hidden; overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; font-size: 13px; min-width: 600px; }
    th { padding: 10px 12px; text-align: left; font-size: 11px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: .5px; background: var(--bg); border-bottom: 1px solid var(--border); white-space: nowrap; cursor: pointer; user-select: none; }
    th:hover { color: var(--primary); }
    th.sorted { color: var(--primary); }
    td { padding: 9px 12px; border-bottom: 1px solid var(--border); vertical-align: middle; }
    tr:last-child td { border-bottom: none; }
    tr:hover td { background: #f8fafc; }
    tr.bd-row td { background: var(--bd-row); }
    tr.bd-row:hover td { background: var(--bd-hover); }
    
    .rank-cell { font-weight: 700; color: var(--text); width: 52px; }
    .app-name-cell { font-weight: 600; max-width: 200px; }
    .app-name-cell span { display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .company-cell { color: var(--muted); max-width: 140px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .num-cell { font-variant-numeric: tabular-nums; color: var(--text); }
    .mmp-cell { }
    
    .chip { display: inline-flex; align-items: center; gap: 3px; font-size: 10px; font-weight: 700; padding: 2px 6px; border-radius: 4px; vertical-align: middle; white-space: nowrap; }
    .chip-new { background: #fff7ed; color: #c2410c; }
    .chip-jump { background: #f0fdf4; color: #059669; }
    .chip-bd { background: var(--success-light); color: var(--success); }
    .chip-mmp { background: var(--primary-light); color: var(--primary); font-size: 10px; }
    
    .rank-change { font-size: 11px; font-weight: 600; }
    .rank-change.up { color: var(--success); }
    .rank-change.down { color: #dc2626; }
    .rank-change.same { color: var(--muted); }
    
    .empty { text-align: center; padding: 32px; color: var(--muted); font-size: 13px; }
    
    .section-group { display: grid; gap: 20px; }
    
    .highlight-section { background: var(--card); border: 1px solid var(--border); border-radius: 10px; overflow: hidden; margin-bottom: 20px; }
    .highlight-header { padding: 12px 16px; background: var(--bg); border-bottom: 1px solid var(--border); font-size: 13px; font-weight: 700; display: flex; align-items: center; gap: 6px; }
    
    .data-date { font-size: 11px; color: var(--warning); background: var(--warning-light); padding: 3px 8px; border-radius: 4px; font-weight: 600; }
    
    @media (max-width: 768px) {
      .toolbar { gap: 8px; padding: 8px 16px; }
      main { padding: 16px; }
      .stats-row { gap: 8px; }
      .stat-card { padding: 10px 14px; }
    }
  </style>
</head>

function fmtNum(n) {
  if (!n && n !== 0) return '-';
  n = Number(n);
  if (n >= 1e6) return (n/1e6).toFixed(1) + 'M';
  if (n >= 1e3) return (n/1e3).toFixed(1) + 'K';
  return Math.round(n).toLocaleString();
}

function isBD(a) {
  return a.mmp && a.mmp !== 'NA' && a.mmp.trim() !== '' && (a.daily_dl || 0) >= 1000;
}

function rankChangeHtml(rc) {
  if (!rc || rc === '=') return '<span class="rank-change same">—</span>';
  if (rc === 'NEW') return '<span class="chip chip-new">🆕 NEW</span>';
  const n = parseInt(rc);
  if (!isNaN(n)) {
    if (n > 0) return `<span class="rank-change up">▲${n}</span>`;
    if (n < 0) return `<span class="rank-change down">▼${Math.abs(n)}</span>`;
  }
  return `<span class="rank-change same">${rc}</span>`;
}

function appNameHtml(a) {
  let name = a.app_name || '';
  let badges = '';
  if (a.is_new) badges += '<span class="chip chip-new">🆕 NEW</span> ';
  if (a.rank_jump && a.rank_jump >= 30) badges += `<span class="chip chip-jump">📈 +${a.rank_jump}</span> `;
  if (a.hq === 'KR') name = name + ' 🇰🇷';
  return `${badges}<span title="${a.app_name || ''}">${name}</span>`;
}

function renderTable(apps, sortKey) {
  if (!apps.length) return '<div class="empty">해당 앱이 없습니다.</div>';
  
  const sorted = [...apps].sort((a,b) => {
    if (sortKey === 'rank') return (a.rank||999) - (b.rank||999);
    if (sortKey === 'dl') return (b.daily_dl||0) - (a.daily_dl||0);
    return (b.dau||0) - (a.dau||0);
  });
  
  const rows = sorted.map(a => {
    const bd = isBD(a);
    return `<tr class="${bd ? 'bd-row' : ''}">
      <td class="rank-cell">#${a.rank || '-'}</td>
      <td class="app-name-cell">${appNameHtml(a)}</td>
      <td class="company-cell" title="${a.company || ''}">${a.company || '-'}</td>
      <td class="mmp-cell">${a.mmp && a.mmp !== 'NA' ? `<span class="chip chip-mmp">${a.mmp}</span>` : '<span style="color:var(--muted)">—</span>'}</td>
      <td class="num-cell">${rankChangeHtml(a.rank_change)}</td>
      <td class="num-cell">${fmtNum(a.daily_dl)}</td>
      <td class="num-cell"><strong>${fmtNum(a.dau)}</strong></td>
    </tr>`;
  }).join('');
  
  return `<div class="table-wrap">
    <table>
      <thead><tr>
        <th>순위</th>
        <th>앱명</th>
        <th>회사</th>
        <th>MMP</th>
        <th>변동</th>
        <th>일간DL</th>
        <th>DAU</th>
      </tr></thead>
      <tbody>${rows}</tbody>
    </table>
  </div>`;
}

function getApps(tab, store, bdOnly, query) {
  let sets = [];
  if (tab === 'all' || tab === 'overall') {
    if (store === 'all' || store === 'app_store') sets.push({label:'📱 Overall · App Store', data: RAW.overall_kr.app_store});
    if (store === 'all' || store === 'google_play') sets.push({label:'📱 Overall · Google Play', data: RAW.overall_kr.google_play});
  }
  if (tab === 'all' || tab === 'games') {
    if (store === 'all' || store === 'app_store') sets.push({label:'🎮 Games · App Store', data: RAW.games_kr.app_store});
    if (store === 'all' || store === 'google_play') sets.push({label:'🎮 Games · Google Play', data: RAW.games_kr.google_play});
  }
  
  const q = query.toLowerCase().trim();
  return sets.map(s => {
    let apps = s.data;
    if (bdOnly) apps = apps.filter(isBD);
    if (q) apps = apps.filter(a => 
      (a.app_name||'').toLowerCase().includes(q) ||
      (a.company||'').toLowerCase().includes(q) ||
      (a.mmp||'').toLowerCase().includes(q)
    );
    return {label: s.label, apps};
  });
}

function renderStats(tab, store, bdOnly, query) {
  const sets = getApps(tab, store, bdOnly, query);
  const total = sets.reduce((s,g) => s + g.apps.length, 0);
  const bdCount = sets.reduce((s,g) => s + g.apps.filter(isBD).length, 0);
  const newCount = (RAW.new_entries||[]).length;
  const jumpCount = (RAW.rank_jumpers||[]).length;
  
  document.getElementById('statsRow').innerHTML = `
    <div class="stat-card"><div class="stat-label">앱 수</div><div class="stat-value">${total}</div><div class="stat-sub">표시 중인 앱</div></div>
    <div class="stat-card"><div class="stat-label">BD 타겟</div><div class="stat-value" style="color:var(--success)">${bdCount}</div><div class="stat-sub">MMP보유+DL≥1K</div></div>
    <div class="stat-card"><div class="stat-label">🆕 NEW 진입</div><div class="stat-value" style="color:#c2410c">${newCount}</div><div class="stat-sub">Overall+Games</div></div>
    <div class="stat-card"><div class="stat-label">📈 급상승</div><div class="stat-value" style="color:var(--success)">${jumpCount}</div><div class="stat-sub">+30↑</div></div>
  `;
}

function renderHighlights() {
  const newEntries = RAW.new_entries || [];
  const jumpers = RAW.rank_jumpers || [];
  
  let html = '';
  
  if (newEntries.length) {
    const rows = newEntries.map(a => `<tr class="${isBD(a)?'bd-row':''}">
      <td>#${a.rank}</td>
      <td class="app-name-cell"><span title="${a.app_name}">${a.app_name}${a.hq==='KR'?' 🇰🇷':''}</span></td>
      <td class="company-cell">${a.company||'-'}</td>
      <td>${a.market==='apple-store'?'App Store':'Google Play'}</td>
      <td>${a.market && a.market.includes('google')?'GP':'AS'}</td>
      <td>${a.mmp&&a.mmp!=='NA'?`<span class="chip chip-mmp">${a.mmp}</span>`:'—'}</td>
    </tr>`).join('');
    
    html += `<div class="highlight-section">
      <div class="highlight-header">🆕 NEW 진입 앱 <span class="badge" style="background:#fff7ed;color:#c2410c;font-size:11px;padding:2px 8px;border-radius:20px;font-weight:700">${newEntries.length}개</span></div>
      <div class="table-wrap" style="border-radius:0;border:none">
        <table><thead><tr><th>순위</th><th>앱명</th><th>회사</th><th>스토어</th><th>탭</th><th>MMP</th></tr></thead>
        <tbody>${rows}</tbody></table>
      </div>
    </div>`;
  }
  
  if (jumpers.length) {
    const rows = jumpers.map(a => `<tr class="${isBD(a)?'bd-row':''}">
      <td><span class="chip chip-jump">+${a.rank_jump}</span></td>
      <td>#${a.rank}</td>
      <td class="app-name-cell"><span title="${a.app_name}">${a.app_name}${a.hq==='KR'?' 🇰🇷':''}</span></td>
      <td>${a.mmp&&a.mmp!=='NA'?`<span class="chip chip-mmp">${a.mmp}</span>`:'—'}</td>
      <td class="num-cell">${fmtNum(a.dau)}</td>
    </tr>`).join('');
    
    html += `<div class="highlight-section">
      <div class="highlight-header">📈 급상승 +30↑ <span class="badge" style="background:#f0fdf4;color:#059669;font-size:11px;padding:2px 8px;border-radius:20px;font-weight:700">${jumpers.length}개</span></div>
      <div class="table-wrap" style="border-radius:0;border:none">
        <table><thead><tr><th>상승폭</th><th>순위</th><th>앱명</th><th>MMP</th><th>DAU</th></tr></thead>
        <tbody>${rows}</tbody></table>
      </div>
    </div>`;
  }
  
  document.getElementById('highlightSection').innerHTML = html;
}

function render() {
  const tab = document.querySelector('#tabSeg .seg-btn.active').dataset.val;
  const store = document.querySelector('#storeSeg .seg-btn.active').dataset.val;
  const bdOnly = document.getElementById('bdToggle').classList.contains('active');
  const query = document.getElementById('searchBox').value;
  const sortKey = document.getElementById('sortSelect').value;
  
  renderStats(tab, store, bdOnly, query);
  
  const sets = getApps(tab, store, bdOnly, query);
  
  let html = sets.map(s => {
    const bdLabel = s.apps.filter(isBD).length;
    return `<div class="section">
      <div class="section-title">${s.label} <span class="badge">BD ${bdLabel}개</span></div>
      ${renderTable(s.apps, sortKey)}
    </div>`;
  }).join('');
  
  if (!html) html = '<div class="empty" style="padding:60px">조건에 맞는 앱이 없습니다.</div>';
  document.getElementById('mainContent').innerHTML = html;
}

// Event listeners
document.querySelectorAll('#tabSeg .seg-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('#tabSeg .seg-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    render();
  });
});

document.querySelectorAll('#storeSeg .seg-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('#storeSeg .seg-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    render();
  });
});

document.getElementById('bdToggle').addEventListener('click', function() {
  this.classList.toggle('active');
  render();
});

document.getElementById('searchBox').addEventListener('input', render);
document.getElementById('sortSelect').addEventListener('change', render);

renderHighlights();
render();
</script>
